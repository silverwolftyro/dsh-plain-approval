<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="鲸鱼娘">
  <title>鲸鱼娘头像</title>
  <!-- 鲸鱼娘形象基于社区二次创作（原作者：上善无形；DeepSeek 元素二创：ZipZipPipe），遵循 CC BY-NC-SA 4.0 -->
  <!-- 水花 -->
  <circle cx="12" cy="3.1" r="1.35" fill="#9fe3ff"/>
  <circle cx="9.5" cy="4.3" r="0.95" fill="#bdeaff"/>
  <circle cx="14.5" cy="4.3" r="0.95" fill="#bdeaff"/>
  <!-- 尾鳍 -->
  <path d="M3.6 13.2C1.1 11.4 0.9 16.4 3.8 15.4Z" fill="#5cc0f2"/>
  <path d="M20.4 13.2C22.9 11.4 23.1 16.4 20.2 15.4Z" fill="#5cc0f2"/>
  <!-- 身体 -->
  <ellipse cx="12" cy="13.9" rx="8.9" ry="7.3" fill="#7fd4ff"/>
  <ellipse cx="12" cy="16.6" rx="6.2" ry="4.1" fill="#eaf7ff"/>
  <!-- 头发刘海 -->
  <path d="M12 6.2c-3.2 0-5.4 1.4-5.9 3.9 1.9-1.1 3.9-1.6 5.9-1.6s4 .5 5.9 1.6C17.4 7.6 15.2 6.2 12 6.2Z" fill="#5aa9e6"/>
  <!-- 发结 -->
  <circle cx="18.4" cy="7.6" r="1.25" fill="#ff7fae"/>
  <!-- 眼睛 -->
  <circle cx="9.1" cy="13" r="1.4" fill="#14283c"/>
  <circle cx="14.9" cy="13" r="1.4" fill="#14283c"/>
  <circle cx="8.6" cy="12.5" r="0.45" fill="#ffffff"/>
  <circle cx="14.4" cy="12.5" r="0.45" fill="#ffffff"/>
  <!-- 腮红 -->
  <ellipse cx="6.5" cy="15.5" rx="1.7" ry="0.95" fill="#ffb3c8" opacity="0.85"/>
  <ellipse cx="17.5" cy="15.5" rx="1.7" ry="0.95" fill="#ffb3c8" opacity="0.85"/>
  <!-- 嘴 -->
  <path d="M10.5 16.1q1.5 1.35 3 0" fill="none" stroke="#14283c" stroke-width="0.9" stroke-linecap="round"/>
</svg>
